openapi: 3.0.1
info:
  title: Microsoft Foundry (DEV)
  description: Microsoft Foundry OpenAI API for chat completions.
  version: '1.0'
servers:
  - url: https://apim-dev-jyovrk3lbu45e.azure-api.net/openai
paths:
  '/deployments/{deploymentId}/chat/completions':
    post:
      summary: Chat Completions
      description: Create a chat completion using a deployed OpenAI model.
      operationId: chat-completions
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            enum:
              - gpt-4o-mini
            type: string
            default: gpt-4o-mini
        - name: apiVersion
          in: query
          required: true
          schema:
            enum:
              - 2024-12-01-preview
            type: string
        - name: contentType
          in: header
          schema:
            enum:
              - ''
            type: string
            default: ''
      responses:
        '200':
          description: ''
components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
security:
  - apiKeyHeader: [ ]
  - apiKeyQuery: [ ]